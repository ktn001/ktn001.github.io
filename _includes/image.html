{%- capture img %}/plugins/{{page.pluginId}}/{{page.lang}}/images/{{include.img}}{% endcapture -%}
{%- capture altImg %}/plugins/{{page.pluginId}}/fr_FR/images/{{include.img}}{% endcapture -%}
<img src="{{img}}"
     alt="{{ include.alt | default: 'Image <%s> introuvable' | replace: "%s", include.img }}" 
     onerror="this.onerror=null; this.src='{{ altImg }}';">
